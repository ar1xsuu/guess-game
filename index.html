async function up(f){if(!f)return;if(!/^image\/(png|jpe?g|webp|gif)$/.test(f.type)||f.size>3e6){alert('Use PNG, JPG, WEBP or GIF under 3 MB.');return}
if(!sb)return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
const path=crypto.randomUUID()+'.'+f.name.split('.').pop().toLowerCase(),{error}=await sb.storage.from('assets').upload(path,f,{contentType:f.type});
if(error){alert(error.message);return}return sb.storage.from('assets').getPublicUrl(path).data.publicUrl}
async function save(pub){const st=$('#st');st.textContent='saving…';try{if(sb){const r={id:1,draft:D};if(pub)r.published=D;const{error}=await sb.from('site_content').upsert(r);if(error)throw error}
else{localStorage.draft=JSON.stringify(D);if(pub)localStorage.pub=localStorage.draft}st.textContent=(pub?'published':'draft saved')+' ✓'}catch(e){st.textContent='error: '+(e.message||e)}}
